apiVersion: v1
kind: ConfigMap
metadata:
  name: websocket-server-config
  namespace: websocket-app
  labels:
    app.kubernetes.io/name: websocket-server
data:
  # Application configuration
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"
  
  # WebSocket settings
  WS_READ_BUFFER_SIZE: "1024"
  WS_WRITE_BUFFER_SIZE: "1024"
  WS_MAX_MESSAGE_SIZE: "524288"
  
  # Connection timeouts
  WS_PING_INTERVAL: "30s"
  WS_PONG_TIMEOUT: "60s"
  WS_WRITE_TIMEOUT: "10s"
