# Secret template - DO NOT commit actual secrets to version control
# Use this as a template and create secrets via kubectl or external secret management
#
# To create the secret manually:
#   kubectl create secret generic websocket-server-secrets \
#     --from-literal=API_KEY=your-actual-api-key \
#     -n websocket-app
#
# Or use External Secrets Operator / Sealed Secrets in production
apiVersion: v1
kind: Secret
metadata:
  name: websocket-server-secrets
  namespace: websocket-app
  labels:
    app.kubernetes.io/name: websocket-server
type: Opaque
stringData:
  # Using stringData instead of data - Kubernetes will base64 encode automatically
  # Replace these placeholder values before deploying to non-local environments
  API_KEY: "change-me-in-production"
